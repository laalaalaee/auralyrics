<!doctype html><html><head><meta charset="utf-8"><title>Style gallery (dev)</title>
<link rel="stylesheet" href="engine.css">
<style>body{margin:0;background:#050507;color:#fff;font:12px 'Segoe UI';display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}
.cell{background:radial-gradient(#1a1a24,#08080b);border-radius:12px;overflow:hidden}.cell h4{margin:6px 10px;font-weight:600;color:#aaa}
.v{height:210px}</style></head><body>
<script src="engine.js"></script>
<script>
const S = { c1:'#ff3d81', c2:'#4d7cff', lyricMatchAlbum:true, lyricScale:100, lyricFont:'Segoe UI Variable Display', lyricOffset:0, lyricStyle:'stack' };
LYRIC_STYLES.forEach(s => { const c = document.createElement('div'); c.className='cell'; c.innerHTML = `<h4>${s.family} · ${s.name}</h4><div class="v"></div>`;
  document.body.appendChild(c); const v = new LyricsView(c.querySelector('.v'), { demo:true, scale:.62, style:s.key });
  v.setNow({ title:'Demo Song', artist:'Auralyrics', art:'' }); v.setSettings(S); });
</script></body></html>
