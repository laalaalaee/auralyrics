name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in main.js preload.js engine.js glow.js autostyle.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Unit tests
        run: npm test
      - name: Version and changelog agree
        run: |
          v=$(node -p "require('./package.json').version")
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
