<!doctype html><html><body><script>
// ---------- Album-art palette extraction ----------
const hex = (r, g, b) => '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
function hsl2hex(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return hex(f(0) * 255, f(8) * 255, f(4) * 255);
}
// Glow colors need to be saturated and mid-bright, or they look muddy on a dark rim.
const vivid = (h, s, l) => hsl2hex(h, Math.max(s, 0.7), Math.min(0.62, Math.max(0.5, l)));

function palette(img) {
  const N = 64, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, N, N);
  const px = x.getImageData(0, 0, N, N).data;
  const BINS = 36, w = new Float32Array(BINS), sl = Array.from({ length: BINS }, () => [0, 0]);
  let grey = 0, lum = 0;
  for (let i = 0; i < px.length; i += 4) {
    const [h, s, l] = rgb2hsl(px[i], px[i + 1], px[i + 2]);
    lum += l;
    if (s < 0.18 || l < 0.1 || l > 0.92) { grey++; continue; }
    const b = Math.floor(h / (360 / BINS)) % BINS;
    const wt = s * s * (1 - Math.abs(l - 0.5) * 1.4);   // favour rich, mid-tone pixels
    w[b] += wt; sl[b][0] += s * wt; sl[b][1] += l * wt;
  }
  // smooth bins so a hue split across a boundary still counts as one
  const sm = w.map((v, i) => v + 0.5 * (w[(i + 1) % BINS] + w[(i + BINS - 1) % BINS]));
  const order = [...sm.keys()].sort((a, b) => sm[b] - sm[a]);
  const total = sm.reduce((a, b) => a + b, 0);
  if (total < 1 || grey / (px.length / 4) > 0.92) {
    // near-monochrome cover: cool white glow, slightly tinted by brightness
    const L = lum / (px.length / 4);
    return [hsl2hex(220, 0.25, 0.75 + L * 0.1), hsl2hex(260, 0.5, 0.62)];
  }
  const color = b => { const t = w[b] || 1e-6; return vivid((b + 0.5) * (360 / BINS), sl[b][0] / t || 0.7, sl[b][1] / t || 0.55); };
  const first = order[0];
  const dist = b => Math.min(Math.abs(b - first), BINS - Math.abs(b - first));
  const second = order.find(b => dist(b) >= 4 && sm[b] > total * 0.04);
  if (second === undefined) {
    // single-hue cover: pair it with an analogous shade
    const h = (first + 0.5) * (360 / BINS);
    return [color(first), hsl2hex((h + 40) % 360, 0.8, 0.5)];
  }
  return [color(first), color(second)];
}
window.api.onExtract(url => {
  const img = new Image();
  img.onload = () => { try { window.api.artColors(palette(img)); } catch (e) { console.error(e); } };
  img.src = url;
});

// ---------- System audio analysis (loopback) ----------
(async () => {
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
    stream.getVideoTracks().forEach(t => t.stop());
  } catch (e) { console.error('audio capture failed', e); return; }
  const ctx = new AudioContext();
  // Rest while the PC is locked or asleep.
  window.api.onAudio(cmd => { cmd === 'pause' ? ctx.suspend() : ctx.resume(); });
  const an = ctx.createAnalyser();
  an.fftSize = 1024; an.smoothingTimeConstant = 0.5;
  ctx.createMediaStreamSource(stream).connect(an);
  const data = new Uint8Array(an.frequencyBinCount);
  const binHz = ctx.sampleRate / an.fftSize;
  const bassTo = Math.max(2, Math.round(150 / binHz));       // ~20–150 Hz kick/bass
  let peak = 0.2, bassAvg = 0, kick = 0;
  setInterval(() => {
    an.getByteFrequencyData(data);
    let bass = 0, all = 0;
    for (let i = 1; i <= bassTo; i++) bass += data[i];
    bass /= bassTo * 255;
    for (let i = 0; i < data.length / 2; i++) all += data[i];
    all /= (data.length / 2) * 255;
    // onset: bass jumps well above its running average → a beat
    if (bass > bassAvg * 1.35 && bass > 0.25) kick = 1;
    bassAvg = bassAvg * 0.9 + bass * 0.1;
    kick *= 0.82;
    const raw = bass * 0.55 + all * 0.6 + kick * 0.35;
    peak = Math.max(raw, peak * 0.997, 0.08);                  // auto-gain to the track's loudness
    window.api.level(Math.min(1, raw / peak));
  }, 1000 / 50);
})();
</script></body></html>
