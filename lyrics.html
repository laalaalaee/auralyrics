<!doctype html><html><head><meta charset="utf-8"><title>Glowrim Lyrics</title>
<link rel="stylesheet" href="engine.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  body.unlocked{-webkit-app-region:drag}
  #frame{position:absolute;inset:0;border-radius:22px;transition:background .3s, box-shadow .3s}
  body.backdrop #frame{background:rgba(10,10,14,.55);backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  body.unlocked #frame{box-shadow:0 0 0 2px rgba(255,255,255,.35) inset;background:rgba(10,10,14,.35)}
  #hint{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);font:12px 'Segoe UI',sans-serif;
    background:rgba(0,0,0,.7);padding:4px 10px;border-radius:99px;color:#ddd;white-space:nowrap;z-index:5}
  body.unlocked #hint{display:block}
  #view{position:absolute;inset:0}
</style></head><body>
<div id="frame"></div>
<div id="hint">Drag to move · drag edges to resize · lock again from the tray or the Lyrics tab</div>
<div id="view"></div>
<script src="engine.js"></script>
<script>
const view = new LyricsView(document.getElementById('view'));
api.onSettings(s => { view.setSettings(s); document.body.classList.toggle('unlocked', !s.lyricLock); document.body.classList.toggle('backdrop', !!s.lyricBackdrop); });
api.onNow(n => view.setNow(n));
api.onTime(t => view.setTime(t));
api.onLyrics(l => view.setLyrics(l));
api.onLevel(v => view.level(v));
</script></body></html>
